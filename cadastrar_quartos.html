<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro de quartos</title>
    <link rel="stylesheet" href="css/estilo_cadastro_hotel.css">
    <link rel="shortcut icon" href="img/imagem-hotel-logomarca.avif" type="image/x-icon">

</head>
<body style="background-color: gray;">
    <h1 style="text-align: center; color: black; border: 1px solid; background-color: blue;">REPOUSO REAL</h1>
    <h2 style="color: black; text-align: center;">Cadastro de Quartos</h2> 

    <div class="form_container">
        <form action="salvar_quarto.php" method="post">
            <div>
                <label for="hotel_id">ID do Hotel:</label>
                <input type="number" name="hotel_id" id="hotel_id" class="caixa_respostas" required min="0">

                <br><br>

                <label for="numero_quarto">Número do quarto:</label>
                <input type="text" name="numero_quarto" id="numero_quarto" class="caixa_respostas" placeholder="101, 202, 205" required>

                <br><br>

                <label for="tipo_quarto">Tipo do quarto:</label>
                <select name="tipo_quarto" id="tipo_quarto" class="caixa_respostas">
                    <option value="Solteiro">Solteiro</option>
                    <option value="Casal">Casal</option>
                    <option value="Suite">Suíte (Luxo)</option>
                </select>

                <br><br>

                <label for="preco">Preço da diária:</label>
                <input type="number" name="preco" id="preco" class="caixa_respostas" step="0.01" min="-0" required>

                <br><br>

                <button class="button_enviar_cadastro_hotel"><b>SALVAR</b></button>

                <br><br>
            </div>
        </form>
        <a href="logout_hotel.php">Sair/Deslogar</a>
    </div>
</body>
</html>
