<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoteis.com</title>
    <link rel="stylesheet" href="css/estilo_cadastro_hotel.css">
    <link rel="shortcut icon" href="img/imagem-hotel-logomarca.avif" type="image/x-icon">

</head>
<body class="fundo">
    <h1 class="titulo_hoteis">HOTEIS<b style="color: blue;">.COM</b></h1>
    <h3 class="subtitulo_hotel">Nosso site facilita a busca e reserva de hotéis para sua viagem.
      Encontre opções de hospedagem, compare preços, confira informações e escolha seu lugar ideal para ficar.
    </h3>

    <div class="form_container">

      <div style="display: flex;">      
        <div style="width: 70%;">
          <h2 style="color: brown;">Cadastro de hotel</h2>   
        </div>
        <div style="padding-top: 5%; padding-left: 30%;">
          <a href="http://localhost/hotel/index.html"> <img src="img/home_28dp_000000_FILL0_wght400_GRAD0_opsz24.png"alt="icone de casa"></a>
        </div>
      </div>
    
    <form action="salvar_hotel.php" method="post">
        <div>
        <label for="nome_hotel">Nome do Hotel:</label>
        <input type="text" name="nome_hotel" id="nome_hotel" placeholder="digite o nome do hotel" required class="caixa_respostas">

        <br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" name="cidade" id="cidade" placeholder="ex: São Paulo" required class="caixa_respostas">

        <br><br>

        <label for="estrelas">Classificação em Estrelas:</label>
        <input type="number" name="estrelas" id="estrelas" min="1" max="5" required class="caixa_respostas">

        <br><br>

        <label for="email">Digite seu E-mail:</label>
        <input type="email" name="email" id="email" placeholder="hoteis.com@gmail.com" required class="caixa_respostas">

        <br><br>

        <label for="senha">Digite sua Senha:</label>
        <input type="password" name="senha" id="senha" required class="caixa_respostas">

        <br><br>

        <button class="button_enviar_cadastro_hotel"><b>ENVIAR</b></button>
      </div>
    </form>
  </div>
</body>
</html>
